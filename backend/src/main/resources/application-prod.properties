# Production profile (activate with --spring.profiles.active=prod)
# All credentials are mandatory from the environment; no hardcoded fallbacks.

# --- MongoDB Atlas (Boot 4 uses the spring.mongodb.* namespace) ---
spring.mongodb.uri=${MONGODB_URI}
spring.mongodb.database=${MONGODB_DATABASE:euodoo_hire}
spring.data.mongodb.auto-index-creation=true
spring.data.mongodb.transaction.enabled=false

# --- Cloudinary ---
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}
# Startup fails fast if Cloudinary is not fully configured
app.storage.require-cloudinary=true
app.storage.dir=${APP_STORAGE_DIR:${user.home}/.euodoo-hire/uploads}
app.storage.signing-secret=${APP_STORAGE_SIGNING_SECRET:}

# --- CORS (empty = same-origin only) ---
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# --- Health check ---
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

logging.level.com.euodoo=INFO
logging.level.org.springframework.security=INFO
server.error.include-stacktrace=never
server.error.include-message=on_param
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
server.port=${PORT:8080}

# --- Subscriptions ---
app.subscription.recruiter-duration-days=${RECRUITER_SUBSCRIPTION_DAYS:30}
app.subscription.candidate-duration-days=${CANDIDATE_SUBSCRIPTION_DAYS:30}

