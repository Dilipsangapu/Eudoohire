<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Agencies | Euodoo Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/admin.css}" href="/css/admin.css" rel="stylesheet">
</head>
<body data-title="Agencies">
<main class="page mx-auto">
    <section class="section">
        <div class="toolbar">
            <h2 class="h-sec me-auto">Recruitment Agency Partners</h2>
            <input class="form-control form-control-sm" type="search" placeholder="Search agency or code" aria-label="Search agencies" data-search="t-agency">
            <select class="form-select form-select-sm" aria-label="Filter by status" data-status="t-agency">
                <option>All statuses</option>
                <option>Approved</option>
                <option>Pending</option>
                <option>Rejected</option>
            </select>
        </div>
        <div class="tbl-wrap">
            <table class="tbl" id="t-agency">
                <thead>
                <tr>
                    <th>Agency Name</th>
                    <th>Code</th>
                    <th>Type</th>
                    <th>Primary Contact</th>
                    <th>Status</th>
                    <th class="text-end">Action</th>
                </tr>
                </thead>
                <tbody></tbody>
            </table>
            <div class="empty" id="t-agency-empty">No agencies found matching your filters.</div>
        </div>
    </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/admin.js}" src="/js/admin.js"></script>
</body>
</html>
