    <!DOCTYPE html>
    <html lang="en" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Registrations | Euodoo Admin</title>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
        <link th:href="@{/css/admin.css}" href="/css/admin.css" rel="stylesheet">
    </head>
    <body data-title="Registrations">
    <main class="page mx-auto">
        <section class="section">
            <div class="toolbar"><h2 class="h-sec me-auto">New Registrations</h2><input class="form-control form-control-sm"
                                                                                        type="search"
                                                                                        placeholder="Search name or ID"
                                                                                        aria-label="Search new registrations"
                                                                                        data-search="t-new"><select
                    class="form-select form-select-sm" aria-label="Filter by type" data-status="t-new">
                <option>All types</option>
                <option>Candidate</option>
                <option>Recruiter</option>
            </select></div>
            <div class="tbl-wrap">
                <table class="tbl" id="t-new">
                    <thead>
                    <tr>
                        <th>Name / ID</th>
                        <th>Type</th>
                        <th>Registered</th>
                        <th>Plan</th>
                        <th>Status</th>
                        <th class="text-end">Action</th>
                    </tr>
                    </thead>
                    <tbody></tbody>
                </table>
                <div class="empty" id="t-new-empty">No registrations match your filters.</div>
            </div>
        </section>
        <section class="section">
            <div class="toolbar"><h2 class="h-sec me-auto">Pending Registrations</h2><input
                    class="form-control form-control-sm" type="search" placeholder="Search name or ID"
                    aria-label="Search pending registrations" data-search="t-pend"><select
                    class="form-select form-select-sm" aria-label="Filter by payment" data-status="t-pend">
                <option>All payments</option>
                <option>Paid</option>
                <option>Unpaid</option>
            </select></div>
            <div class="tbl-wrap">
                <table class="tbl" id="t-pend">
                    <thead>
                    <tr>
                        <th>Applicant</th>
                        <th>Type</th>
                        <th>Registered</th>
                        <th>Payment</th>
                        <th>Approval</th>
                        <th class="text-end">Actions</th>
                    </tr>
                    </thead>
                    <tbody></tbody>
                </table>
                <div class="empty" id="t-pend-empty">No pending registrations match your filters.</div>
            </div>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/admin.js}" src="/js/admin.js"></script>
    </body>
    </html>
