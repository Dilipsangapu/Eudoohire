<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Companies | Euodoo Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/admin.css}" href="/css/admin.css" rel="stylesheet">
</head>
<body data-title="Companies">
<main class="page mx-auto">
    <section class="section">
        <div class="toolbar"><h2 class="h-sec me-auto">Company Directory</h2><input class="form-control form-control-sm"
                                                                                    type="search"
                                                                                    placeholder="Search company or ID"
                                                                                    aria-label="Search companies"
                                                                                    data-search="t-co"><select
                class="form-select form-select-sm" aria-label="Filter by status" data-status="t-co">
            <option>All statuses</option>
            <option>Active</option>
            <option>Inactive</option>
        </select></div>
        <div class="tbl-wrap">
            <table class="tbl" id="t-co">
                <thead>
                <tr>
                    <th>Company</th>
                    <th class="text-end">Recruiters</th>
                    <th class="text-end">Active jobs</th>
                    <th>Verification</th>
                    <th>Status</th>
                    <th class="text-end">Action</th>
                </tr>
                </thead>
                <tbody></tbody>
            </table>
            <div class="empty" id="t-co-empty">No companies match your filters.</div>
        </div>
    </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/admin.js}" src="/js/admin.js"></script>
</body>
</html>
