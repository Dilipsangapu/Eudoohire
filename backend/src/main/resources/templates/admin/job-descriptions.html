<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Job Descriptions | Euodoo Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/admin.css}" href="/css/admin.css" rel="stylesheet">
</head>
<body data-title="Job Descriptions">
<main class="page mx-auto">
    <section class="section">
        <!-- Toolbar: search + filters + Post Job button -->
        <div class="toolbar">
            <h2 class="h-sec me-auto">Job Descriptions</h2>
            <input class="form-control form-control-sm" style="max-width:180px"
                   type="search" placeholder="Search jobs…" aria-label="Search jobs">
            <select id="jb-filter-status" class="form-select form-select-sm" style="max-width:130px" aria-label="Filter by status">
                <option value="">All Statuses</option>
                <option value="DRAFT">Draft</option>
                <option value="ACTIVE">Active</option>
                <option value="INACTIVE">Inactive</option>
                <option value="CLOSED">Closed</option>
            </select>
            <select id="jb-filter-creator" class="form-select form-select-sm" style="max-width:140px" aria-label="Filter by creator">
                <option value="">All Creators</option>
                <option value="CLIENT_ADMIN">Admin Created</option>
                <option value="RECRUITER">Recruiter Created</option>
            </select>
            <button id="jb-post-btn" class="btn btn-sm btn-brand">
                <i class="bi bi-plus-lg"></i> Post Job
            </button>
        </div>

        <!-- Split panel: left list + right detail -->
        <div class="split">
            <div class="list">
                <!-- Job list rendered by admin.js jobs() -->
                <div class="empty" style="display:block">Loading jobs…</div>
            </div>
            <div class="detail">
                <!-- Job detail rendered by admin.js jobs() -->
                <p class="muted">Select a job to view details.</p>
            </div>
        </div>
    </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<!-- Tech-icons module intentionally NOT loaded here: admin pages render
     technology names as plain text; SVG icon pills are enabled only on the
     candidate full job-description view (see admin.js techPill). -->
<script th:src="@{/js/admin.js}" src="/js/admin.js"></script>
</body>
</html>
