<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hire Matches | Euodoo Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/admin.css}" href="/css/admin.css" rel="stylesheet">
</head>
<body data-title="Hire Matches">
<main class="page mx-auto">
    <section class="section">
        <div class="toolbar"><h2 class="h-sec me-auto">Candidate&ndash;Recruiter Hire Matches</h2><input
                class="form-control form-control-sm" type="search" placeholder="Search recruiter ID or candidate ID"
                aria-label="Search hire matches" data-search="t-hm"><select class="form-select form-select-sm"
                                                                            aria-label="Filter by approval"
                                                                            data-status="t-hm">
            <option>All approvals</option>
            <option>Approved</option>
            <option>Pending</option>
        </select></div>
        <div class="tbl-wrap">
            <table class="tbl" id="t-hm">
                <thead>
                <tr>
                    <th>Recruiter ID</th>
                    <th>Candidate</th>
                    <th>Recruiter / Company</th>
                    <th>Requested</th>
                    <th>Hiring fee</th>
                    <th>Payment</th>
                    <th>Approval</th>
                    <th class="text-end">Action</th>
                </tr>
                </thead>
                <tbody></tbody>
            </table>
            <div class="empty" id="t-hm-empty">No hire matches found.</div>
        </div>
    </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/admin.js}" src="/js/admin.js"></script>
</body>
</html>
