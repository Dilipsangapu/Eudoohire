<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Candidates | Euodoo Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <script>document.documentElement.classList.add("loading")</script>
    <link th:href="@{/css/admin.css}" href="/css/admin.css" rel="stylesheet">
</head>
<body data-title="Candidates">
<main class="page mx-auto">
    <div class="strip s4 mb-2" role="list">
        <div class="metric" role="listitem"><i class="bi bi-person-lines-fill"></i>
            <div>
                <div class="num" data-m="cTotal">0</div>
                <div class="lbl">Total candidates</div>
            </div>
        </div>
        <div class="metric" role="listitem"><i class="bi bi-hourglass-split"></i>
            <div>
                <div class="num" data-m="cPending">0</div>
                <div class="lbl">Awaiting approval</div>
            </div>
        </div>
        <div class="metric" role="listitem"><i class="bi bi-check-circle"></i>
            <div>
                <div class="num" data-m="cActive">0</div>
                <div class="lbl">Active accounts</div>
            </div>
        </div>
        <div class="metric" role="listitem"><i class="bi bi-slash-circle"></i>
            <div>
                <div class="num" data-m="cInactive">0</div>
                <div class="lbl">Inactive accounts</div>
            </div>
        </div>
    </div>
    <section class="section mt-3">
        <div class="toolbar"><h2 class="h-sec me-auto">Candidates</h2><input class="form-control form-control-sm"
                                                                             type="search"
                                                                             placeholder="Search candidate, ID or email"
                                                                             aria-label="Search candidates"
                                                                             data-search="t-cand"><select hidden
                                                                                                          data-status="t-cand"
                                                                                                          aria-hidden="true">
            <option>All statuses</option>
            <option>Pending</option>
            <option>Active</option>
            <option>Inactive</option>
            <option>Rejected</option>
        </select></div>
        <div class="tabs" role="tablist" aria-label="Filter candidates">
            <button class="tab active" role="tab" aria-selected="true" data-for="t-cand" data-tab="All statuses">
                All<span class="count" data-count="cAll">0</span></button>
            <button class="tab" role="tab" aria-selected="false" data-for="t-cand" data-tab="Pending">Awaiting
                approval<span class="count" data-count="cPend">0</span></button>
            <button class="tab" role="tab" aria-selected="false" data-for="t-cand" data-tab="Active">Active<span
                    class="count" data-count="cAct">0</span></button>
            <button class="tab" role="tab" aria-selected="false" data-for="t-cand" data-tab="Inactive">Inactive<span
                    class="count" data-count="cInact">0</span></button>
        </div>
        <div class="tbl-wrap">
            <table class="tbl" id="t-cand">
                <thead>
                <tr>
                    <th>Candidate</th>
                    <th>Registered</th>
                    <th>Plan</th>
                    <th>Payment</th>
                    <th>Account</th>
                    <th class="text-end">Actions</th>
                </tr>
                </thead>
                <tbody></tbody>
            </table>
            <div class="empty" id="t-cand-empty">No candidates match your filters.</div>
        </div>
    </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/admin.js}" src="/js/admin.js"></script>
</body>
</html>
