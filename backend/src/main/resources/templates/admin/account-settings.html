<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Account Settings | Euodoo Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/admin.css}" href="/css/admin.css" rel="stylesheet">
</head>
<body data-title="Account Settings">
<main class="page mx-auto">
    <section class="section"><h2 class="h-sec mb-3">Profile</h2>
        <div class="row g-3" style="max-width:640px">
            <div class="col-md-6"><label class="form-label fw-medium" for="n">Full name</label><input id="n"
                                                                                                      class="form-control"
                                                                                                      value="Client Admin">
            </div>
            <div class="col-md-6"><label class="form-label fw-medium" for="e">Email</label><input id="e" type="email"
                                                                                                  class="form-control"
                                                                                                  value="admin@euodoo.com">
            </div>
            <div class="col-12">
                <button class="btn btn-brand">Save changes</button>
            </div>
        </div>
    </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/admin.js}" src="/js/admin.js"></script>
</body>
</html>
