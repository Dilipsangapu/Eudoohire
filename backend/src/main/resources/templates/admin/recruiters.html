<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Recruiters | Euodoo Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <script>document.documentElement.classList.add("loading")</script>
    <link th:href="@{/css/admin.css}" href="/css/admin.css" rel="stylesheet">
</head>
<body data-title="Recruiters">
<main class="page mx-auto">
    <div class="strip s4 mb-2" role="list">
        <div class="metric" role="listitem"><i class="bi bi-person-badge"></i>
            <div>
                <div class="num" data-m="total">0</div>
                <div class="lbl">Total recruiters</div>
            </div>
        </div>
        <div class="metric" role="listitem"><i class="bi bi-patch-question"></i>
            <div>
                <div class="num" data-m="vr">0</div>
                <div class="lbl">Awaiting verification</div>
            </div>
        </div>
        <div class="metric" role="listitem"><i class="bi bi-check-circle"></i>
            <div>
                <div class="num" data-m="active">0</div>
                <div class="lbl">Active accounts</div>
            </div>
        </div>
        <div class="metric" role="listitem"><i class="bi bi-slash-circle"></i>
            <div>
                <div class="num" data-m="inactive">0</div>
                <div class="lbl">Inactive accounts</div>
            </div>
        </div>
    </div>
    <section class="section mt-3">
        <div class="toolbar"><h2 class="h-sec me-auto">New Recruiters</h2><input class="form-control form-control-sm"
                                                                                 type="search"
                                                                                 placeholder="Search recruiter, ID, company or email"
                                                                                 aria-label="Search recruiters"
                                                                                 data-search="t-rec"><select hidden
                                                                                                             data-status="t-rec"
                                                                                                             aria-hidden="true">
            <option>All verification</option>
            <option>Verification required</option>
            <option>Verified</option>
            <option>Inactive</option>
        </select></div>
        <div class="tabs" role="tablist" aria-label="Filter recruiters">
            <button class="tab active" role="tab" aria-selected="true" data-tab="All verification">All<span
                    class="count" data-count="all">0</span></button>
            <button class="tab" role="tab" aria-selected="false" data-tab="Verification required">Needs
                verification<span class="count" data-count="vr">0</span></button>
            <button class="tab" role="tab" aria-selected="false" data-tab="Verified">Verified<span class="count"
                                                                                                   data-count="v">0</span>
            </button>
            <button class="tab" role="tab" aria-selected="false" data-tab="Inactive">Inactive<span class="count"
                                                                                                   data-count="i">0</span>
            </button>
        </div>
        <div class="tbl-wrap">
            <table class="tbl" id="t-rec">
                <thead>
                <tr>
                    <th>Recruiter</th>
                    <th>Company</th>
                    <th>Registered</th>
                    <th>Payment</th>
                    <th>Verification</th>
                    <th>Account</th>
                    <th class="text-end">Actions</th>
                </tr>
                </thead>
                <tbody></tbody>
            </table>
            <div class="empty" id="t-rec-empty">No recruiters match your filters.</div>
        </div>
    </section>
    <section class="section">
        <div class="row g-5">
            <div class="col-lg-6"><h2 class="h-sec mb-3">Actively Hiring</h2>
                <ul class="timeline" id="hiring"></ul>
            </div>
            <div class="col-lg-6"><h2 class="h-sec mb-3">Waiting for Candidates</h2>
                <div class="rows" id="waiting"></div>
            </div>
        </div>
    </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/admin.js}" src="/js/admin.js"></script>
</body>
</html>
